<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Æon</title>
    <meta name="description" content="Æon (s.p.e_c) — a little neon city that never sleeps." />
    <meta name="theme-color" content="#0b0418" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Æon ✦ s.p.e_c" />
    <meta property="og:description" content="your value doesn’t decrease because of someone’s inability to see your worth." />
    <meta property="og:image" content="assets/img/avatar.webp" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Outfit:wght@300;400;500;600&family=Pixelify+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preload" href="assets/img/avatar.webp" as="image" />
    <link rel="preload" href="assets/img/banner.webp" as="image" />

    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.min.js",
          "three/addons/": "./assets/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body class="is-locked">
    <!-- the city -->
    <canvas id="city" aria-hidden="true"></canvas>
    <div class="fallback-sky" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="sparkles" aria-hidden="true"></canvas>
    <div class="cursor" aria-hidden="true"><span class="cursor-ring"></span><span class="cursor-dot"></span></div>

    <!-- click to enter -->
    <div id="enter" class="enter" role="button" tabindex="0" aria-label="Click to enter">
      <div class="enter-scan" aria-hidden="true"></div>
      <div class="enter-inner">
        <div class="enter-moon" aria-hidden="true"></div>
        <p class="enter-title">
          <span id="enter-text">waking the city</span><span class="caret" aria-hidden="true"></span>
        </p>
        <div class="enter-loader" aria-hidden="true"><span id="enter-progress"></span></div>
        <p class="enter-sub" id="enter-sub">♫ house song — searows</p>
      </div>
      <p class="enter-hint">headphones on ✦ turn it up a little</p>
    </div>

    <!-- profile -->
    <main class="stage" id="stage">
      <!-- frosted glass lives outside the 3D layer stack so backdrop blur works -->
      <div class="glass" aria-hidden="true"></div>
      <div class="tilt" id="tilt">
        <article class="card" id="card" aria-label="Profile card">
          <div class="card-border" aria-hidden="true"></div>
          <div class="card-glare" aria-hidden="true"></div>

          <div class="card-content">
            <header class="banner">
              <img class="banner-img" id="banner" alt="" />
              <div class="banner-shine" aria-hidden="true"></div>
              <span class="chip chip-views" id="weather-chip" title="Current weather in the city"></span>
            </header>

            <div class="avatar-row">
              <div class="avatar" id="avatar">
                <span class="avatar-ring" aria-hidden="true"></span>
                <img class="avatar-img" id="avatar-img" alt="" />
                <span class="status-dot" id="status-dot" title="Idle" aria-label="Idle"></span>
                <span class="skulls" id="skulls" aria-hidden="true"></span>
              </div>
              <div class="status-bubble" id="status-bubble">
                <span id="status-text"></span>
              </div>
            </div>

            <section class="identity">
              <h1 class="display-name">
                <span class="name-text" id="display-name"></span>
                <span class="name-emoji" aria-hidden="true">
                  <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#ff9be6" /><circle cx="7" cy="8" r="1.4" fill="#3a0f3d" /><circle cx="13" cy="8" r="1.4" fill="#3a0f3d" /><path d="M6 11.5c1 2.2 7 2.2 8 0" fill="none" stroke="#3a0f3d" stroke-width="1.5" stroke-linecap="round" /></svg>
                </span>
              </h1>
              <p class="handle">
                <span id="username"></span>
                <span class="dot-sep" aria-hidden="true">•</span>
                <span class="server-tag" title="Server tag"><img src="assets/img/avatar.webp" alt="" />SpEc</span>
              </p>
              <ul class="badges" id="badges" aria-label="Badges"></ul>
            </section>

            <nav class="socials" id="socials" aria-label="Socials"></nav>

            <section class="block">
              <h2>Bio</h2>
              <p class="bio" id="bio" aria-live="off"></p>
            </section>

            <section class="block block-row">
              <div>
                <h2>Member Since</h2>
                <p class="meta" id="member-since"></p>
              </div>
              <div class="grow">
                <h2>Connections</h2>
                <ul class="connections" id="connections"></ul>
              </div>
            </section>

            <section class="block presence" id="presence" hidden>
              <h2>Right Now</h2>
              <p class="meta" id="presence-text"></p>
            </section>

            <section class="player" id="player" aria-label="Music player">
              <div class="player-top">
                <div class="disc" id="disc" aria-hidden="true"><span class="disc-label"></span></div>
                <div class="track">
                  <p class="track-title" id="track-title"></p>
                  <p class="track-artist" id="track-artist"></p>
                </div>
                <canvas class="viz" id="viz" aria-hidden="true"></canvas>
              </div>
              <div class="progress">
                <span class="time" id="time-cur">0:00</span>
                <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="bar-fill" id="bar-fill"></div>
                  <div class="bar-knob" id="bar-knob"></div>
                </div>
                <span class="time" id="time-dur">0:00</span>
              </div>
              <div class="player-controls">
                <div class="volume">
                  <button class="icon-btn sm" id="vol-btn" aria-label="Mute"></button>
                  <input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume" />
                </div>
                <div class="transport">
                  <button class="icon-btn" id="prev-btn" aria-label="Previous"></button>
                  <button class="icon-btn play" id="play-btn" aria-label="Play"></button>
                  <button class="icon-btn" id="next-btn" aria-label="Next"></button>
                </div>
                <div class="loop-tag" aria-hidden="true">on repeat</div>
              </div>
            </section>
          </div>
        </article>
      </div>
    </main>

    <!-- hud -->
    <div class="hud-left" aria-hidden="true">
      <span id="clock">--:--</span>
      <span class="hud-sep">/</span>
      <span id="hud-weather">rain</span>
    </div>

    <aside class="dock" aria-label="Scene settings">
      <button class="icon-btn" id="weather-btn" data-tip="weather · W"></button>
      <button class="icon-btn" id="ambience-btn" data-tip="ambience · A"></button>
      <button class="icon-btn" id="pixel-btn" data-tip="pixel mode · P"></button>
      <button class="icon-btn" id="mute-btn" data-tip="mute · M"></button>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">this little city needs JavaScript to wake up ✦</div>
    </noscript>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
