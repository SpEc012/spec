<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Æon</title>
    <meta name="description" content="Æon (s.p.e_c) — a little neon city that never sleeps." />
    <meta name="theme-color" content="#0b0418" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Æon ✦ s.p.e_c" />
    <meta property="og:description" content="your value doesn’t decrease because of someone’s inability to see your worth." />
    <meta property="og:image" content="assets/img/avatar.webp" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" href="assets/img/favicon.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Outfit:wght@300;400;500;600&family=Pixelify+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preload" href="assets/img/avatar.webp" as="image" />

    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.min.js",
          "three/addons/": "./assets/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body class="is-locked">
    <!-- the city -->
    <canvas id="city" aria-hidden="true"></canvas>
    <div class="fallback-sky" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="sparkles" aria-hidden="true"></canvas>
    <div class="cursor" aria-hidden="true"><span class="cursor-ring"></span><span class="cursor-dot"></span></div>

    <!-- click to enter -->
    <div id="enter" class="enter" role="button" tabindex="0" aria-label="Click to enter">
      <div class="enter-scan" aria-hidden="true"></div>
      <div class="enter-inner">
        <div class="enter-moon" aria-hidden="true"></div>
        <p class="enter-title">
          <span id="enter-text">waking the city</span><span class="caret" aria-hidden="true"></span>
        </p>
        <div class="enter-loader" aria-hidden="true"><span id="enter-progress"></span></div>
        <p class="enter-sub" id="enter-sub">♫ house song — searows</p>
      </div>
      <p class="enter-hint">headphones on ✦ turn it up a little</p>
    </div>

    <!-- the card -->
    <main class="stage" id="stage">
      <!-- frosted glass lives outside the 3D layer stack so backdrop blur works -->
      <div class="glass" aria-hidden="true"></div>

      <div class="tilt" id="tilt">
        <!-- ─── front ─── -->
        <article class="face front" id="card" aria-label="Profile">
          <div class="card-border" aria-hidden="true"></div>
          <div class="card-glare" aria-hidden="true"></div>

          <div class="face-content">
            <div class="corner">
              <span class="chip" id="views-chip" hidden title="Profile views">
                <span class="chip-ico" id="views-ico"></span><span id="views">0</span>
              </span>
              <button class="chip chip-btn" id="flip-btn" aria-label="Flip the card">
                <span class="chip-ico" id="flip-ico"></span>flip
              </button>
            </div>

            <header class="hero">
              <div class="avatar">
                <span class="avatar-glow" aria-hidden="true"></span>
                <span class="avatar-ring" aria-hidden="true"></span>
                <img class="avatar-img" id="avatar-img" alt="" />
                <span class="avatar-orbit" aria-hidden="true"><i></i></span>
              </div>

              <div class="hero-text">
                <h1 class="name">
                  <span class="name-text" id="display-name"></span>
                  <span class="name-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
                </h1>
                <p class="tagline" aria-live="off">
                  <span id="tagline"></span><span class="caret" aria-hidden="true"></span>
                </p>
                <div class="meta-row">
                  <span class="meta" id="location"></span>
                  <ul class="badges" id="badges" aria-label="Badges"></ul>
                </div>
              </div>
            </header>

            <nav class="socials" id="socials" aria-label="Socials"></nav>

            <div class="widgets">
              <button class="widget discord" id="discord-widget" aria-label="Copy Discord username">
                <span class="dw-avatar">
                  <img src="assets/img/avatar.webp" alt="" />
                  <span class="status-dot" id="status-dot" data-status="idle" title="Idle"></span>
                </span>
                <span class="dw-text">
                  <span class="dw-name"><span id="dw-name"></span><span class="dw-user" id="dw-user"></span></span>
                  <span class="dw-status" id="dw-status"></span>
                </span>
                <span class="dw-icon" id="dw-icon" aria-hidden="true"></span>
              </button>

              <section class="widget player" id="player" aria-label="Music player">
                <div class="disc" aria-hidden="true"><span class="disc-label"></span></div>
                <div class="track">
                  <div class="track-row">
                    <p class="track-title" id="track-title"></p>
                    <canvas class="viz" id="viz" aria-hidden="true"></canvas>
                  </div>
                  <p class="track-artist" id="track-artist"></p>
                  <div class="progress">
                    <span class="time" id="time-cur">0:00</span>
                    <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                      <div class="bar-fill" id="bar-fill"></div>
                      <div class="bar-knob" id="bar-knob"></div>
                    </div>
                    <span class="time" id="time-dur">0:00</span>
                  </div>
                </div>
                <div class="transport">
                  <button class="icon-btn sm" id="prev-btn" aria-label="Previous" hidden></button>
                  <button class="icon-btn play" id="play-btn" aria-label="Play"></button>
                  <button class="icon-btn sm" id="next-btn" aria-label="Next" hidden></button>
                </div>
              </section>
            </div>
          </div>
        </article>

        <!-- ─── back ─── -->
        <article class="face back" aria-label="About">
          <div class="card-border" aria-hidden="true"></div>
          <div class="face-content back-content">
            <div class="corner">
              <button class="chip chip-btn" id="flip-back-btn" aria-label="Flip back">
                <span class="chip-ico" id="flip-back-ico"></span>back
              </button>
            </div>

            <p class="back-kicker">✦ about</p>
            <p class="back-quote" id="about"></p>

            <div class="facts">
              <div class="fact">
                <span class="fact-label">member since</span>
                <span class="fact-value" id="member-since"></span>
              </div>
              <div class="fact">
                <span class="fact-label">local time</span>
                <span class="fact-value" id="back-clock"></span>
              </div>
              <div class="fact">
                <span class="fact-label">on repeat</span>
                <span class="fact-value" id="back-track"></span>
              </div>
            </div>

            <div class="back-links" id="links"></div>

            <p class="shortcuts">
              <kbd>W</kbd> weather <kbd>P</kbd> pixel <kbd>M</kbd> mute <kbd>F</kbd> flip
            </p>
          </div>
        </article>
      </div>
    </main>

    <!-- volume (top-left, guns.lol style) -->
    <div class="vol-pill" id="vol-pill">
      <button class="icon-btn sm" id="vol-btn" aria-label="Mute"></button>
      <input type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume" />
    </div>

    <!-- hud -->
    <div class="hud-left" aria-hidden="true">
      <span id="clock">--:--</span>
      <span class="hud-sep">/</span>
      <span id="hud-weather">snowy night</span>
    </div>

    <aside class="dock" aria-label="Scene settings">
      <button class="icon-btn" id="weather-btn" data-tip="weather · W"></button>
      <button class="icon-btn" id="pixel-btn" data-tip="pixel mode · P"></button>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">this little city needs JavaScript to wake up ✦</div>
    </noscript>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
